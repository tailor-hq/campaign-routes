name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs first and on its own: nothing else about this repository matters if it
  # is leaking something. Scans the working tree AND the commit history, since a
  # clean tree with a leaking commit message is still a leak, and rewriting
  # history after a repository is public is far more expensive than before.
  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 audit-public-readiness.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines.node` claims, the current LTS, and the newest.
        # A package with no dependencies has no excuse for only working on one.
        node: ['18', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Before the tests: package-shape.test.ts reads dist/ and asserts what a
      # customer receives — the byte budget, the stripped comments, the JSDoc
      # left intact. It skips itself when there is no build, so an unbuilt run
      # would pass while checking nothing.
      - run: npm run build
      - run: npm test

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm pack
      # Installing the tarball into an empty project is the only check that
      # covers the exports map, the `files` list and the declaration paths
      # together. Everything else tests the source; this tests the artifact.
      - name: install the tarball the way a customer would
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/tailor-ai-campaign-routes-*.tgz
          node --input-type=module -e "
            import { matchCampaignRoute } from '@tailor-ai/campaign-routes';
            import { createEndpointRouteSource } from '@tailor-ai/campaign-routes/endpoint';
            import { campaignRouteFor } from '@tailor-ai/campaign-routes/next';
            import { createContentfulRouteSource } from '@tailor-ai/campaign-routes/contentful';
            const m = matchCampaignRoute(
              [{ basePath: '/pricing', matchParams: { utm_campaign: 'enterprise' }, targetPath: '/pricing-enterprise' }],
              { path: '/pricing', searchParams: { utm_campaign: 'enterprise', gclid: 'x' } }
            );
            if (m?.targetPath !== '/pricing-enterprise') throw new Error('core did not match: ' + JSON.stringify(m));
            for (const f of [createEndpointRouteSource, campaignRouteFor, createContentfulRouteSource]) {
              if (typeof f !== 'function') throw new Error('missing export');
            }
            // The published surface is exactly these four. lambda-edge lives in
            // examples/ because it has never run in that runtime, so importing
            // it must FAIL — this is the check that catches it being re-exported
            // by accident, which package-shape.test.ts pins from the other side.
            let refused = false;
            try { await import('@tailor-ai/campaign-routes/lambda-edge'); }
            catch { refused = true; }
            if (!refused) throw new Error('lambda-edge is exported; it is an example, not an entry point');
            console.log('every entry point imports, the core matches, and examples stay unpublished');
          "
