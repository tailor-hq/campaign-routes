name: Release

# Publishes to npm when a version tag is pushed.
#
# **Inert until NPM_TOKEN exists**, which is deliberate. A publish under the
# `@tailor-ai` scope is permanent and is not something a merge should be able
# to do by accident, so the secret is added when a release is meant. Without it
# the guard below fails the job with a readable message rather than a
# `npm ERR! need auth` at the end of a build.
#
# The package is public: `--access public` below, and no `private` field in
# package.json (`package-shape.test.ts` pins its absence). A scoped package
# publishes as restricted unless told otherwise, so the flag is load-bearing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: refuse to publish without a token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not set, so this repository cannot publish yet."
            echo "That is the expected state until we decide to publish."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # The tag and package.json disagreeing is the classic release bug: the tag
      # says v0.2.0, npm gets 0.1.0, and the mismatch is only visible months
      # later when somebody tries to find the source for a published version.
      - name: check the tag matches the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # A `"private": true` in package.json would make npm refuse to publish at
      # all, whatever `--access` says; `--access` is only the visibility. Keep
      # the two in agreement in the same commit if either ever changes.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
